<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azevedo Academy — Em breve</title>
  <meta name="description" content="Azevedo Academy: IA, criação de conteúdo, design, edição de vídeo, marketing e tecnologia. Site em construção." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global.css" />

  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
    }

    .hero .eyebrow {
      font-family: var(--font-body);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: var(--space-4);
    }

    .hero h1 {
      font-size: var(--text-4xl);
      color: var(--color-text);
      max-width: 20ch;
    }

    .hero h1 span {
      color: var(--color-accent);
    }

    .hero p {
      margin-top: var(--space-5);
      max-width: 42ch;
      font-size: var(--text-lg);
      color: var(--color-text-muted);
    }

    .hero .actions {
      margin-top: var(--space-8);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      justify-content: center;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      font-family: var(--font-display);
      font-weight: var(--weight-semibold);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      transition: border-color var(--transition-fast), color var(--transition-fast);
    }

    .btn-secondary:hover {
      border-color: var(--color-accent-secondary);
      color: var(--color-accent-secondary);
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: var(--text-3xl);
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <p class="eyebrow">Azevedo Academy</p>
    <h1>Site em <span>construção</span></h1>
    <p>
      IA, criação de conteúdo, design, edição de vídeo, marketing e tecnologia.
      Estamos preparando algo novo — enquanto isso, nos acompanhe no YouTube.
    </p>
    <div class="actions">
      <!-- TODO: substituir pelo link real do canal do YouTube -->
      <a class="btn btn-primary" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        Inscreva-se no YouTube
      </a>
    </div>
  </main>
</body>
</html>
