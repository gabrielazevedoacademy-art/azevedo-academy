<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Studio privado | Azevedo Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/higgsfield-studio.css">
</head>
<body>
  <main class="studio-shell">
    <section id="login-view" class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">ÁREA PRIVADA</p><h1 id="login-title">Higgsfield Studio</h1>
      <p class="muted">Entre com a senha privada configurada no servidor.</p>
      <form id="login-form"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary" type="submit">Entrar</button><p id="login-error" class="error" role="alert"></p></form>
    </section>

    <section id="app-view" hidden>
      <header class="studio-header"><div><p class="eyebrow">FERRAMENTA PRIVADA</p><h1>Higgsfield Studio</h1><p class="muted">Geração pela API oficial, com credenciais protegidas no servidor.</p></div><button id="logout" class="btn subtle" type="button">Sair</button></header>
      <div id="notice" class="notice" role="status" hidden></div>
      <form id="generation-form" class="studio-grid">
        <section class="panel controls"><h2>Configuração</h2><label for="media">Tipo</label><select id="media"><option value="video">Vídeo</option></select><label for="model">Modelo</label><select id="model"></select><label for="workflow">Workflow</label><input id="workflow" readonly><div id="uploads"></div><div id="parameters"></div></section>
        <section class="panel prompt-panel"><div class="panel-title"><h2>Prompt</h2><button id="clear-prompt" class="text-button" type="button">Limpar</button></div><label class="sr-only" for="prompt">Prompt</label><textarea id="prompt" placeholder="Descreva com detalhes o resultado desejado…" required></textarea><p id="prompt-count" class="counter">0 caracteres</p></section>
        <aside class="panel result-panel"><button id="generate" class="btn btn-primary generate" type="submit">Gerar</button><div class="status-wrap"><span id="status-dot" class="status-dot"></span><div><span class="muted small">STATUS</span><strong id="status">Pronto</strong></div></div><div id="result" class="result"></div></aside>
      </form>
      <section class="panel history-panel"><div class="panel-title"><h2>Histórico recente</h2><button id="clear-history" class="text-button" type="button">Limpar</button></div><div id="history" class="history-list"><p class="muted">Nenhuma geração ainda.</p></div></section>
    </section>
  </main>
  <script src="/assets/js/higgsfield-studio.js" defer></script>
</body>
</html>
