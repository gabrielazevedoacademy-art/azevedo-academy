<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Biblioteca de Prompts — Azevedo Academy</title>
  <meta name="description" content="Biblioteca de Prompts da Azevedo Academy. Página acessível apenas por link direto." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/global.css" />

  <style>
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-6);
    }

    .hero .eyebrow {
      font-family: var(--font-body);
      font-weight: var(--weight-semibold);
      font-size: var(--text-sm);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent-secondary);
      margin-bottom: var(--space-4);
    }

    .hero h1 {
      font-size: var(--text-3xl);
      color: var(--color-text);
      max-width: 22ch;
    }

    .hero p {
      margin-top: var(--space-5);
      max-width: 46ch;
      font-size: var(--text-lg);
      color: var(--color-text-muted);
    }

    .hero .actions {
      margin-top: var(--space-8);
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: var(--text-2xl);
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <p class="eyebrow">Biblioteca de Prompts</p>
    <h1>Essa página está quase pronta</h1>
    <p>
      Estamos finalizando a Biblioteca de Prompts da Azevedo Academy.
      Em breve você poderá conferir todos os detalhes por aqui.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Voltar para a página inicial</a>
    </div>
  </main>
</body>
</html>
